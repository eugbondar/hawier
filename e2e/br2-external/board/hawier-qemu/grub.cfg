# hawier reference device: A/B with one trial boot.
#
# SWUpdate (2025.05, state in GRUB's environment as `ustate`) installs into the
# inactive slot, sets rootslot to it and ustate=1, and reboots. After a reboot
# suricatta reports success only from ustate=2 (testing) and then resets it
# to 0, and reports failure from ustate=3. So:
#   ustate=1  first boot of the new slot: mark it as a trial (2) and boot it
#   ustate=2  the trial never reached the updater: go back, report failure (3)
#   otherwise boot rootslot
# The kernel runs with panic=5 and init=/sbin/init, so a slot that cannot
# start reboots by itself and lands in the second case.

set default=0
set timeout=0

load_env rootslot ustate
if [ -z "$rootslot" ]; then
	set rootslot=a
fi

if [ "$ustate" = "1" ]; then
	set ustate=2
	save_env ustate
elif [ "$ustate" = "2" ]; then
	if [ "$rootslot" = "b" ]; then
		set rootslot=a
	else
		set rootslot=b
	fi
	set ustate=3
	save_env rootslot ustate
fi

if [ "$rootslot" = "b" ]; then
	set slotpart=msdos3
	set slotdev=/dev/vda3
else
	set slotpart=msdos2
	set slotdev=/dev/vda2
fi

menuentry "hawier slot $rootslot" {
	linux (hd0,$slotpart)/boot/bzImage root=$slotdev rootfstype=squashfs ro rootwait console=ttyS0 panic=5 init=/sbin/init hawier.slot=$rootslot
}
