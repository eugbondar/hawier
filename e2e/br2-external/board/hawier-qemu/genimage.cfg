# MBR with exactly four primaries; GRUB's core image sits in the gap before
# the first partition, so no BIOS-boot partition is needed.

image boot.ext2 {
	ext2 {
		label = "boot"
		use-mke2fs = true
	}
	size = 4M
}

image data.ext4 {
	ext4 {
		label = "data"
		use-mke2fs = true
	}
	empty = true
	size = 16M
}

image disk.img {
	hdimage {
		partition-table-type = "mbr"
	}

	partition mbr {
		in-partition-table = "no"
		image = "boot.img"
		offset = 0
		size = 512
		holes = {"(440; 512)"}
	}

	partition grub {
		in-partition-table = "no"
		image = "grub.img"
		offset = 512
	}

	partition boot {
		partition-type = 0x83
		image = "boot.ext2"
		offset = 1M
	}

	partition slota {
		partition-type = 0x83
		image = "slot-v1.squashfs"
		size = 16M
	}

	partition slotb {
		partition-type = 0x83
		image = "slot-v1.squashfs"
		size = 16M
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
