---
# Three values the node must be given explicitly. Left unset they do not fail:
# HAWIER_MGMT_USERS falls back to admin:admin:DEFAULT and HAWIER_INTERNAL_TOKEN
# to dev-internal-token (apps/server/src/config.rs), so forgetting them is not
# an error, it is a well-known shared secret.
#
# They are generated on the target with `creates:`, which is the cleanest
# idempotency available: the file is never rewritten, so a second deploy
# cannot change a password by accident.

- name: the secrets directory
  ansible.builtin.file:
    path: "{{ hawier_dir }}/secrets"
    state: directory
    owner: "{{ hawier_owner }}"
    group: "{{ hawier_group }}"
    mode: "0700"

# The database password is the one that cannot be changed by writing it here:
# POSTGRES_PASSWORD is read by initdb alone, so an existing volume keeps
# whatever it was initialised with. Written only if there is nothing yet; a
# value that differs from the file is refused further down, with the ALTER USER
# to do it deliberately.
- name: the database password, if there is none yet
  ansible.builtin.copy:
    content: "{{ hawier_postgres_password }}"
    dest: "{{ hawier_dir }}/secrets/postgres_password"
    owner: "{{ hawier_owner }}"
    group: "{{ hawier_group }}"
    mode: "0600"
    force: false
  when: hawier_postgres_password | length > 0
  no_log: true

# These two the node reads from its environment every time it starts, and both
# sides of the console get them from the same fact, so nothing is pinned by
# history: an override replaces what is there. That is how a password gets
# changed —
#
#   make deploy-<host> ANSIBLE_ARGS='-e hawier_mgmt_users=admin:NEW:DEFAULT'
#
# which keeps it out of the inventory and out of git. (It stays in this
# machine's shell history; a `make creds-<host>` afterwards is how you check
# which one actually took.)
- name: the console credentials and the internal token, if given
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ hawier_dir }}/secrets/{{ item.name }}"
    owner: "{{ hawier_owner }}"
    group: "{{ hawier_group }}"
    mode: "0600"
  loop:
    - { name: internal_token, value: "{{ hawier_internal_token }}" }
    - { name: mgmt_users, value: "{{ hawier_mgmt_users }}" }
  loop_control:
    label: "{{ item.name }}"
  when: item.value | length > 0
  no_log: true

# Alphanumerics only, and that is not cosmetic: the postgres password goes
# into postgres://user:PW@postgres:5432/db (@ : / # ? break the URL), the
# admin password into HAWIER_MGMT_USERS which is split on `,` then `:`
# (apps/server/src/config.rs:103), and everything passes through compose's
# YAML of the compose file, where a quote would have to be escaped. 32 of them
# is ~190 bits; do not "improve" this with punctuation.
- name: generate the postgres password, once
  ansible.builtin.shell:
    cmd: >-
      umask 077; LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 32
      > {{ hawier_dir }}/secrets/postgres_password
    executable: /bin/bash
    creates: "{{ hawier_dir }}/secrets/postgres_password"

- name: generate the internal token, once
  ansible.builtin.shell:
    cmd: >-
      umask 077; LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 32
      > {{ hawier_dir }}/secrets/internal_token
    executable: /bin/bash
    creates: "{{ hawier_dir }}/secrets/internal_token"

- name: generate the console credentials, once
  ansible.builtin.shell:
    cmd: >-
      umask 077;
      printf 'admin:%s:DEFAULT' "$(LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 32)"
      > {{ hawier_dir }}/secrets/mgmt_users
    executable: /bin/bash
    creates: "{{ hawier_dir }}/secrets/mgmt_users"
  register: hawier_mgmt_generated

- name: read the secrets back
  ansible.builtin.slurp:
    src: "{{ hawier_dir }}/secrets/{{ item }}"
  loop: [postgres_password, internal_token, mgmt_users]
  register: hawier_secret_files
  no_log: true

# `| trim` matters: a stray newline in the password breaks the database URL
# exactly once, at first init, and looks like "postgres rejected the password".
- name: keep them together
  ansible.builtin.set_fact:
    hawier_secrets: >-
      {{ dict(hawier_secret_files.results | map(attribute='item')
              | zip(hawier_secret_files.results | map(attribute='content')
                    | map('b64decode') | map('trim'))) }}
  no_log: true

# POSTGRES_PASSWORD is only read by initdb, the first time the data volume is
# empty. A second deploy with a different one leaves the connection string and
# the database disagreeing — and what crash-loops is the server, not anything
# that mentions a password.
- name: refuse to silently change an initialised postgres password
  ansible.builtin.assert:
    that: hawier_postgres_password == hawier_secrets.postgres_password
    fail_msg: |
      hawier_postgres_password differs from {{ hawier_dir }}/secrets/postgres_password.
      POSTGRES_PASSWORD only applies when the data volume is first initialised,
      so changing it here would leave the server unable to connect.
      To rotate it deliberately, on the host, from {{ hawier_dir }}:
        {{ hawier_compose_cmd | join(' ') }} exec postgres \
          psql -U {{ hawier_db_user }} -c "ALTER USER {{ hawier_db_user }} PASSWORD '<new>'"
      then write <new> into {{ hawier_dir }}/secrets/postgres_password and re-run.
    quiet: true
  when: hawier_postgres_password | length > 0
  no_log: true

- name: the values are usable where they end up
  ansible.builtin.assert:
    that:
      - hawier_secrets.postgres_password is match('^[A-Za-z0-9._-]{16,}$')
      - hawier_secrets.internal_token is match('^[A-Za-z0-9._-]{16,}$')
      - hawier_secrets.mgmt_users | length > 0
    fail_msg: >-
      a secret contains characters that would not survive the postgres URL,
      the `,`/`:` split of HAWIER_MGMT_USERS or compose's `$` interpolation.
      Use [A-Za-z0-9._-], at least 16 characters.
    quiet: true
  no_log: true

# The console's own credentials, split out for the verification step.
- name: the admin account
  ansible.builtin.set_fact:
    hawier_admin_user: "{{ hawier_secrets.mgmt_users.split(',')[0].split(':')[0] }}"
    hawier_admin_pass: "{{ hawier_secrets.mgmt_users.split(',')[0].split(':')[1] }}"
  no_log: true
