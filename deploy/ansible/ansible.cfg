# Only read when ansible runs with this directory as $CWD, which `make` does
# not do — the deploy targets export ANSIBLE_CONFIG instead.
[defaults]
roles_path = roles
host_key_checking = True
interpreter_python = auto_silent
# No stdout_callback: the `yaml` one was removed in ansible-core 2.19 and
# naming it there stops the run before it starts.
display_skipped_hosts = False
retry_files_enabled = False
forks = 10

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
