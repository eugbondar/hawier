---
# Who to log into a deployed console as. `make creds-<host>`.
#
# The values are generated on the host on the first deploy and printed once, on
# that run — which is no help at all a week later, and "ssh in and cat the file"
# is not an answer make is allowed to give. Printed, never written to a file:
# the report file sits in the working directory, and a password does not belong
# there.
- name: how to log in to hawier on this host
  hosts: all
  become: true
  # Nothing here reads a gathered fact.
  gather_facts: false

  tasks:
    - name: read the console credentials
      ansible.builtin.slurp:
        src: "{{ hawier_dir }}/secrets/mgmt_users"
      register: hawier_creds
      no_log: true

    - name: and the console's address
      ansible.builtin.set_fact:
        # user:password[:tenant], first entry — see HAWIER_MGMT_USERS.
        hawier_cred_parts: "{{ (hawier_creds.content | b64decode | trim).split(',')[0].split(':') }}"
      no_log: true

    - name: there
      ansible.builtin.debug:
        msg:
          - "console:  {{ 'https://' ~ hawier_console_host if hawier_tls | bool
                           else 'http://' ~ (ansible_host | default(inventory_hostname)) ~ ':' ~ hawier_publish_ui.split(':')[-1] }}"
          - "user:     {{ hawier_cred_parts[0] }}"
          - "password: {{ hawier_cred_parts[1] }}"
          - "tenant:   {{ hawier_cred_parts[2] | default('DEFAULT') }}"
          - "kept in {{ hawier_dir }}/secrets/mgmt_users on the host, 0600"
